[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  function = "og"
  path = "/"

[[edge_functions]]
  function = "og"
  path = "/research"

[[edge_functions]]
  function = "og"
  path = "/research/*"

[[edge_functions]]
  function = "og"
  path = "/docs"

[[edge_functions]]
  function = "og"
  path = "/docs/*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Egregore installer — served as text so curl | bash works.
[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"

[[headers]]
  for = "/install"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"

# Sign-in URLs can carry a private continuation or a legacy one-time token.
[[headers]]
  for = "/login"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "private, no-store"
    Netlify-CDN-Cache-Control = "no-store"

# Artifact recovery: exact routes to the independently operated API. These
# precede the retired /api/auth/* and /view/:org/:id proxies. The API verifies
# identities, methods, queries and UUIDs; other hosted capabilities stay held.
[[redirects]]
  from = "/view/curvelabs/:id"
  to = "https://api.egregore.xyz/api/recovery/artifacts/:id/page"
  status = 200
  force = true

[[redirects]]
  from = "/recovery/artifacts/sign-in"
  to = "https://api.egregore.xyz/recovery/artifacts/sign-in"
  status = 200
  force = true

[[redirects]]
  from = "/callback"
  to = "https://api.egregore.xyz/callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/recovery/github/start"
  to = "https://api.egregore.xyz/api/auth/recovery/github/start"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/recovery/github/callback"
  to = "https://api.egregore.xyz/api/auth/recovery/github/callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/recovery/session"
  to = "https://api.egregore.xyz/api/auth/recovery/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/recovery/session/orgs/curvelabs"
  to = "https://api.egregore.xyz/api/auth/recovery/session/orgs/curvelabs"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/recovery/logout"
  to = "https://api.egregore.xyz/api/auth/recovery/logout"
  status = 200
  force = true

# ── Held during security recovery ─────────────────────────────────────
# Since the 22 Oct 2026 security incident the old hosted API no longer
# serves egregore.xyz, and the site must not proxy to a host it no longer
# controls. Every path that used to reach it is answered by the `held`
# edge function (netlify/edge-functions/held.js): 503, no-store, noindex;
# a page for people, JSON for API and agent paths. Edge functions run
# before [[redirects]], so the artifact-recovery redirects above are kept
# out of these paths: /api/auth/recovery/* by excludedPath and
# /view/curvelabs/* by excludedPattern; /recovery/artifacts/sign-in and
# /callback match no held path.

# API, OAuth and agent payloads (JSON). /api/* covers the former proxies
# (/api/auth/*, /api/v1/*, /api/artifacts/handoff/*, /api/spirits/*,
# /api/billing/*), the former emissary-metrics function, and the setup,
# desk and admin calls the client code now makes same-origin.
[[edge_functions]]
  function = "held"
  path = "/api/*"
  excludedPath = ["/api/auth/recovery/*", "/api/research-drafts/*"]

[[edge_functions]]
  function = "held"
  path = "/oauth/*"

[[edge_functions]]
  function = "held"
  path = "/.well-known/oauth-authorization-server"

[[edge_functions]]
  function = "held"
  path = "/emissary/manifest.json"

[[edge_functions]]
  function = "held"
  path = "/emissary/raw/*"

[[edge_functions]]
  function = "held"
  path = "/emissary/plugin.zip"

# Handoff and emissary reads: /h/{id} and /emissary/e/{id} are pages;
# /h/{id}/reply and /emissary/e/{id}/raw answer JSON. The install hub
# (/emissary, /emissary/verify, /emissary/i/*) stays static.
[[edge_functions]]
  function = "held"
  path = "/h/*"

[[edge_functions]]
  function = "held"
  path = "/emissary/e/*"

# Vanity emissary slugs.
[[edge_functions]]
  function = "held"
  path = "/emissary/traction"

[[edge_functions]]
  function = "held"
  path = "/emissary/dataroom"

[[edge_functions]]
  function = "held"
  path = "/emissary/deck"

[[edge_functions]]
  function = "held"
  path = "/emissary/paper"

[[edge_functions]]
  function = "held"
  path = "/emissary/evals"

# Member setup, spirits and CLI device approval.
[[edge_functions]]
  function = "held"
  path = "/account/connect"

[[edge_functions]]
  function = "held"
  path = "/spirits/connect"

[[edge_functions]]
  function = "held"
  path = "/connect/device"

# Platform namespace: /@{handle}, /@{handle}/{slug}, /@{handle}/{slug}/raw.
[[edge_functions]]
  function = "held"
  path = "/@*"

# Artifact short links that were served from the old API.
[[edge_functions]]
  function = "held"
  path = "/deck"

[[edge_functions]]
  function = "held"
  path = "/demo"

[[edge_functions]]
  function = "held"
  path = "/memo"

[[edge_functions]]
  function = "held"
  path = "/view/lego/context-management"

[[edge_functions]]
  function = "held"
  path = "/how-egregore-keeps-context-alive"

# ── Legacy artifact pages: held pending a decision ──────────────────────
# /view/_/{id} (ephemeral) and /view/{org}/{id} for every organization
# other than curvelabs used to proxy to the old API. A pending decision
# may repoint these legacy pages; change this block when it lands.
# /view/curvelabs/{id} stays with the recovery redirect above, and
# /view/{org} alone was never proxied.
[[edge_functions]]
  function = "held"
  pattern = "^/view/_/[^/]+/?$"

[[edge_functions]]
  function = "held"
  pattern = "^/view/[^/]+/[^/]+/?$"
  excludedPattern = ["^/view/curvelabs/", "^/view/_/"]

# /install (no extension) rewrites to /install.sh — both URLs serve the
# same content; the no-extension form is what we tell users to curl.
# Must come before the SPA catch-all.
[[redirects]]
  from = "/install"
  to = "/install.sh"
  status = 200
  force = true

# egregore.xyz/mcp is the human-facing setup page (a Next.js route under
# app/(setup)/mcp). The bare proxy to the MCP server has been removed —
# users register at /mcp, get a personalised /mcp/u/<token> URL, and
# paste THAT (the direct Railway URL) into Claude.ai's connector panel.
# The setup page never needed the proxy; install instructions have
# always pointed at the Railway URL directly.

# Emissary platform browse page — a static Next route
# (app/(setup)/emissary/browse) that fetches the shelf client-side from
# the public platform API. The former Railway proxy is gone; the static
# file wins over the unforced SPA catch-all.

# Token-bound install entry point: /emissary/i/{token} — a static Next page
# (out/emissary/i.html) that reads the token from the URL path client-side.
# Rewrite (not proxy) so the install hub renders for any token.
[[redirects]]
  from = "/emissary/i/:token"
  to = "/emissary/i.html"
  status = 200

# Private research desk API: handled on Egregore's own Netlify site.
[[redirects]]
  from = "/api/research-drafts/*"
  to = "/.netlify/functions/research-drafts/:splat"
  status = 200
  force = true

[[headers]]
  for = "/drafts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
